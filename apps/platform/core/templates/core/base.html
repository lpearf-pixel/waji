<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Waji 现场采集{% endblock %}</title>
  <style>
    :root { color-scheme: light; --ink:#17202a; --muted:#65717d; --line:#d8dee5; --panel:#fff; --bg:#f4f6f8; --accent:#1f5f4a; --warn:#8a4b08; --danger:#9f2d20; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:var(--bg); }
    header { background:#162b24; color:#fff; padding:12px 16px; position:sticky; top:0; z-index:5; }
    nav { max-width:1040px; margin:auto; display:flex; align-items:center; gap:12px; }
    nav a { color:#fff; text-decoration:none; font-weight:650; }
    nav .spacer { flex:1; }
    nav form { margin:0; }
    main { max-width:1040px; margin:0 auto; padding:16px; }
    h1 { font-size:1.55rem; margin:4px 0 16px; }
    h2 { font-size:1.18rem; margin:20px 0 10px; }
    h3 { font-size:1rem; margin:14px 0 8px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
    .button, button { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:10px 14px; border-radius:9px; border:1px solid var(--accent); background:var(--accent); color:#fff; text-decoration:none; font-size:1rem; cursor:pointer; }
    .button.secondary, button.secondary { background:#fff; color:var(--accent); }
    .button.warning { border-color:var(--warn); background:var(--warn); }
    .button.danger { border-color:var(--danger); background:var(--danger); }
    label { display:block; font-weight:650; margin-top:12px; }
    input, select, textarea { width:100%; font:inherit; padding:11px; border:1px solid #aeb8c2; border-radius:8px; background:#fff; }
    input[type=checkbox] { width:auto; margin-right:7px; }
    ul { padding-left:22px; }
    .helptext, .muted { color:var(--muted); font-size:.9rem; }
    .errorlist { color:var(--danger); font-weight:650; }
    .message { padding:11px 13px; border-radius:8px; margin-bottom:10px; background:#e8f4ee; border:1px solid #a9d5c0; }
    .message.warning { background:#fff4df; border-color:#ecc47d; }
    .safety { background:#fff4df; border:1px solid #e6b65f; border-radius:10px; padding:12px; margin-bottom:14px; }
    .status { display:inline-block; padding:5px 9px; border-radius:999px; font-weight:700; background:#e6eaee; }
    .status.verified_complete { background:#dff3e8; color:#155d3d; }
    .status.complete { background:#e7eefc; color:#254d8b; }
    .status.incomplete { background:#fde7e4; color:#8b2c21; }
    .timeline { border-left:3px solid #ccd4db; padding-left:14px; margin-left:6px; }
    audio { width:100%; margin:6px 0 10px; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; border-bottom:1px solid var(--line); padding:9px 6px; vertical-align:top; }
    code { overflow-wrap:anywhere; }
    @media (max-width:640px) { main { padding:12px; } th:nth-child(3),td:nth-child(3) { display:none; } .button,button { width:100%; } nav button { width:auto; min-height:36px; padding:6px 10px; } }
  </style>
</head>
<body>
<header>
  <nav>
    <a href="{% url 'field-dashboard' %}">Waji 现场采集</a>
    <span class="spacer"></span>
    {% if user.is_authenticated %}
      <span>{{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="secondary" type="submit">退出</button></form>
    {% endif %}
  </nav>
</header>
<main>
  {% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
