name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/platform/requirements.txt
      - run: pip install --quiet -r apps/platform/requirements.txt
      - run: python apps/platform/manage.py check
      - name: Run Gate 0 tests
        shell: bash
        run: |
          set +e
          python apps/platform/manage.py test core.tests -v 2 > /tmp/gate0-tests.log 2>&1
          status=$?
          tail -n 220 /tmp/gate0-tests.log
          exit $status

  audio-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall services/audio_ai/app

  edge-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path edge/agent/Cargo.toml

  skill-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.skills.test_waji_skills -v
